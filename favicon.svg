<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0a1410"/>
  <!-- Blue path -->
  <line x1="5"  y1="5"  x2="16" y2="5"  stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="5"  x2="16" y2="16" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="5"  y2="16" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Copper path -->
  <line x1="27" y1="5"  x2="27" y2="16" stroke="#d97757" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="27" y2="27" stroke="#d97757" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="27" x2="16" y2="27" stroke="#d97757" stroke-width="2" stroke-linecap="round"/>
  <!-- Dots -->
  <circle cx="5"  cy="5"  r="3" fill="#3b82f6"/>
  <circle cx="5"  cy="16" r="3" fill="#3b82f6"/>
  <circle cx="27" cy="5"  r="3" fill="#d97757"/>
  <circle cx="16" cy="27" r="3" fill="#d97757"/>
</svg>
